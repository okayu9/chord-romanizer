name: Strict Rust core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --manifest-path chord-romanizer-rs/Cargo.toml -- --check
      - name: Run Rust unit, integration, and documentation tests
        run: cargo test --manifest-path chord-romanizer-rs/Cargo.toml --locked
